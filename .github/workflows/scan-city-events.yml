name: Scan for city events and street closures

on:
  schedule:
    - cron: "*/30 * * * *"   # police log and Ruter notices only show recent items, so scan often
  workflow_dispatch: {}      # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: scan-city-events
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Scan Politiloggen, Ruter and news
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}   # optional: push alerts to the ntfy app
        run: node scripts/scan-city-events.mjs

      - name: Commit updated data if changed
        run: |
          if git diff --quiet -- data/city-events.json && [ -z "$(git ls-files --others --exclude-standard data/city-events.json)" ]; then
            echo "No change to data/city-events.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/city-events.json
          git commit -m "Update auto-detected city events"
          git pull --rebase origin "${GITHUB_REF_NAME}"   # the AIS workflow also pushes to this branch
          git push
